name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install uv
      # Product facts (quotas, URLs) must match ground truth.
      - run: sh scripts/truthcheck.sh
      - run: make lint
      - run: make check
      # Unit tests run with the network blocked; integration tests
      # (which need a real LIVETENNISAPI_KEY) are excluded.
      - run: make test
