name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv
      # Product facts (quotas, URLs) must match ground truth.
      - run: sh scripts/truthcheck.sh
      - run: make lint
      - run: make check
      # Unit tests run with the network blocked; integration tests
      # (which need a real LIVETENNISAPI_KEY) are excluded.
      - run: make test
