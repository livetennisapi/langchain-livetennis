[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-livetennis"
description = "Integration package connecting the Live Tennis API and LangChain"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "Live Tennis API", email = "hello@livetennisapi.com" }]
keywords = ["langchain", "tennis", "live scores", "atp", "wta", "tools", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dynamic = ["version"]
requires-python = ">=3.10.0,<4.0.0"
dependencies = [
    "langchain-core>=1.5.1,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.7.4,<3.0.0",
]

[project.urls]
Homepage = "https://livetennisapi.com"
Documentation = "https://docs.livetennisapi.com"
Repository = "https://github.com/livetennisapi/langchain-livetennis"
Issues = "https://github.com/livetennisapi/langchain-livetennis/issues"
Changelog = "https://github.com/livetennisapi/langchain-livetennis/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "langchain>=1.0.0,<2.0.0",
]
lint = ["ruff>=0.13.1,<0.16.0"]
typing = ["mypy>=1.15.0,<2.2.0"]

[tool.hatch.version]
path = "langchain_livetennis/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["langchain_livetennis"]

[tool.hatch.build.targets.sdist]
include = ["langchain_livetennis", "tests", "README.md", "LICENSE", "Makefile"]

[tool.mypy]
disallow_untyped_defs = true
strict_equality = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Messes with the formatter
    "ISC001",  # Messes with the formatter
    "PERF203", # Rarely useful
    "SIM105",  # Rarely useful
    "FIX",     # TODOs
    "TD",      # TODOs
    "C901",    # Complex functions
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
    "PLR0911", # Too many return statements
    "ANN401",  # Dynamically typed expressions (the API payload is untyped JSON)
    "TRY003",  # Long messages: the error text is the useful part for an agent
    # Exception names mirror the official `livetennisapi` SDK (Unauthorized,
    # UpgradeRequired, NotFound, RateLimited) so the two read the same.
    "N818",
]
unfixable = ["B028"] # People should intentionally tune the stacklevel

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # Tests use assert
    "PLR2004", # Comparison to magic number
    "SLF001",  # Tests reach into private helpers on purpose
    "D",       # Test docstring conventions are relaxed
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
asyncio_mode = "auto"
markers = [
    "requires_key: integration test that needs a real LIVETENNISAPI_KEY",
]

[tool.coverage.run]
omit = ["tests/*"]
